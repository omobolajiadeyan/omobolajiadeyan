name: Daily live site audit

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-live-site-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/site-audit/package-lock.json
      - run: npm ci --prefix .github/site-audit
      - run: npx --prefix .github/site-audit playwright install --with-deps chromium
      - name: Test live sites and measure three mobile runs
        id: audit
        continue-on-error: true
        run: npm run audit --prefix .github/site-audit
      - name: Preserve detailed reports and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-site-audit-${{ github.run_id }}
          path: .site-audit-artifacts/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
      - name: Publish timestamped profile results
        if: always()
        run: |
          if [ ! -f reports/site-audit/latest.json ]; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md reports/site-audit/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: refresh daily live-site audit'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Mark failed checks as failed
        if: steps.audit.outcome == 'failure'
        run: exit 1
