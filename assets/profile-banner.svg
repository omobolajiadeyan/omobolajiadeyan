<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Omobolaji Adeyan security engineering profile banner</title>
  <desc id="desc">A dark security engineering banner showing a signal moving through analysis into reviewable evidence.</desc>
  <rect width="1200" height="360" rx="26" fill="#0B1020"/>
