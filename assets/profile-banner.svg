  <text x="72" y="115" fill="#E5E7EB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="44" font-weight="700" letter-spacing="0">Omobolaji Adeyan</text>
  <text x="72" y="158" fill="#7DD3FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" letter-spacing="0">Security products built around proof—not promises.</text>
  <text x="72" y="207" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">I turn phishing, vulnerability, and CI/CD signals into decisions engineers can</text>
  <text x="72" y="234" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">inspect, reproduce, and act on.</text>
