  <text x="816" y="133" fill="#BAE6FD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600">SIGNAL</text>
  <text x="927" y="173" fill="#DDD6FE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600">EXPLAIN</text>
  <text x="1041" y="213" fill="#BBF7D0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600">ACT</text>
  <path d="M888 282C926 242 961 242 1000 282C1038 322 1075 322 1114 282" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.65"/>
