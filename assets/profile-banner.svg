<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Omobolaji Adeyan — cybersecurity engineer and security tool builder</title>
  <desc id="desc">Banner reading: Cybersecurity engineer and security tool builder. Security tools built around proof, not promises. Vulnerability management with signed, approved endpoint fixes, plus merged security fixes in CISA, OWASP, and Prowler projects. Focus areas: application security, detection engineering, vulnerability triage, and security automation.</desc>
