  <text x="72" y="128" fill="#E5E7EB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="44" font-weight="700" letter-spacing="0">Omobolaji Adeyan</text>
  <text x="72" y="168" fill="#7DD3FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" letter-spacing="0">Security tools built around proof—not promises.</text>
  <text x="72" y="212" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">Vulnerability management with signed, approved endpoint fixes,</text>
  <text x="72" y="239" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" letter-spacing="0">plus merged security fixes in CISA, OWASP, and Prowler projects.</text>
