    <text x="297" y="315" text-anchor="middle" fill="#BBF7D0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">VERIFY</text>
    <rect x="376" y="291" width="144" height="36" rx="18" fill="#2B2111" stroke="#5C431A"/>
    <text x="448" y="315" text-anchor="middle" fill="#FDE68A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">DOCUMENT</text>
