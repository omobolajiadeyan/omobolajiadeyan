<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">How FreNiMiGuard turns an asset inventory into closed, evidenced findings</title>
  <desc id="desc">Six stages left to right: inventory, match, prioritize, fix, verify, evidence. Below them, the endpoint trust boundary: remote actions are off by default, by default need a second administrator's approval, and reach the agent as RSA-signed envelopes that the agent checks against a key pinned at enrollment, rejecting unsigned, expired, wrong-agent, or replayed actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="400" rx="22" fill="url(#bg)"/>

  <text x="40" y="48" fill="#38BDF8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.8">FRENIMIGUARD · FINDING TO VERIFIED FIX</text>

  <!-- Stage boxes: x = 40 + i*190, width 160 -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="40" y="76" width="160" height="150" rx="12" fill="#111827" stroke="#334155"/>
    <rect x="40" y="76" width="160" height="4" rx="2" fill="#38BDF8"/>
    <text x="56" y="108" fill="#E5E7EB" font-size="16" font-weight="700">Inventory</text>
    <text x="56" y="134" fill="#94A3B8" font-size="12.5">Agentless import:</text>
    <text x="56" y="152" fill="#94A3B8" font-size="12.5">Intune, Jamf, CSV,</text>
    <text x="56" y="170" fill="#94A3B8" font-size="12.5">cloud evidence</text>
    <text x="56" y="196" fill="#94A3B8" font-size="12.5">or an optional</text>
    <text x="56" y="214" fill="#94A3B8" font-size="12.5">self-installed agent</text>

    <rect x="230" y="76" width="160" height="150" rx="12" fill="#111827" stroke="#334155"/>
    <rect x="230" y="76" width="160" height="4" rx="2" fill="#60A5FA"/>
    <text x="246" y="108" fill="#E5E7EB" font-size="16" font-weight="700">Match</text>
    <text x="246" y="134" fill="#94A3B8" font-size="12.5">Installed software vs.</text>
    <text x="246" y="152" fill="#94A3B8" font-size="12.5">CISA KEV and NVD</text>
    <text x="246" y="178" fill="#94A3B8" font-size="12.5">NVD CPE version</text>
    <text x="246" y="196" fill="#94A3B8" font-size="12.5">ranges confirm or</text>
    <text x="246" y="214" fill="#94A3B8" font-size="12.5">rule out each match</text>

    <rect x="420" y="76" width="160" height="150" rx="12" fill="#111827" stroke="#334155"/>
    <rect x="420" y="76" width="160" height="4" rx="2" fill="#A78BFA"/>
    <text x="436" y="108" fill="#E5E7EB" font-size="16" font-weight="700">Prioritize</text>
    <text x="436" y="134" fill="#94A3B8" font-size="12.5">Risk score: severity,</text>
    <text x="436" y="152" fill="#94A3B8" font-size="12.5">KEV, ransomware use,</text>
    <text x="436" y="170" fill="#94A3B8" font-size="12.5">asset criticality</text>
    <text x="436" y="196" fill="#94A3B8" font-size="12.5">SLA policy sets owner</text>
    <text x="436" y="214" fill="#94A3B8" font-size="12.5">and deadline per finding</text>

    <rect x="610" y="76" width="160" height="150" rx="12" fill="#111827" stroke="#F59E0B" stroke-opacity="0.7"/>
    <rect x="610" y="76" width="160" height="4" rx="2" fill="#F59E0B"/>
    <text x="626" y="108" fill="#E5E7EB" font-size="16" font-weight="700">Fix</text>
    <text x="626" y="134" fill="#94A3B8" font-size="12.5">Windows Update,</text>
    <text x="626" y="152" fill="#94A3B8" font-size="12.5">winget, apt/dnf,</text>
    <text x="626" y="170" fill="#94A3B8" font-size="12.5">macOS updates</text>
    <text x="626" y="196" fill="#FCD34D" font-size="12.5">Approved, signed,</text>
    <text x="626" y="214" fill="#FCD34D" font-size="12.5">and audited</text>

    <rect x="800" y="76" width="160" height="150" rx="12" fill="#111827" stroke="#334155"/>
    <rect x="800" y="76" width="160" height="4" rx="2" fill="#34D399"/>
    <text x="816" y="108" fill="#E5E7EB" font-size="16" font-weight="700">Verify</text>
    <text x="816" y="134" fill="#94A3B8" font-size="12.5">Fresh inventory,</text>
    <text x="816" y="152" fill="#94A3B8" font-size="12.5">then rescan</text>
    <text x="816" y="178" fill="#94A3B8" font-size="12.5">Auto-closes once the</text>
    <text x="816" y="196" fill="#94A3B8" font-size="12.5">version leaves NVD's</text>
    <text x="816" y="214" fill="#94A3B8" font-size="12.5">range; else analyst</text>

    <rect x="990" y="76" width="170" height="150" rx="12" fill="#111827" stroke="#334155"/>
    <rect x="990" y="76" width="170" height="4" rx="2" fill="#22C55E"/>
    <text x="1006" y="108" fill="#E5E7EB" font-size="16" font-weight="700">Evidence</text>
    <text x="1006" y="134" fill="#94A3B8" font-size="12.5">NIST 800-53 control</text>
    <text x="1006" y="152" fill="#94A3B8" font-size="12.5">tracking and OSCAL</text>
    <text x="1006" y="170" fill="#94A3B8" font-size="12.5">export</text>
    <text x="1006" y="196" fill="#94A3B8" font-size="12.5">Audit trail of every</text>
    <text x="1006" y="214" fill="#94A3B8" font-size="12.5">request and decision</text>
  </g>

  <!-- Arrows between stages -->
  <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <path d="M203 151H226"/>
    <path d="M393 151H416"/>
    <path d="M583 151H606"/>
    <path d="M773 151H796"/>
    <path d="M963 151H986"/>
  </g>

  <!-- Trust boundary under the Fix stage -->
  <path d="M690 226V262" stroke="#F59E0B" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="40" y="262" width="1120" height="104" rx="12" fill="#1C1917" fill-opacity="0.35" stroke="#F59E0B" stroke-opacity="0.55" stroke-dasharray="6 5"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="60" y="290" fill="#FBBF24" font-size="12" font-weight="700" letter-spacing="1.6">ENDPOINT TRUST BOUNDARY</text>

    <text x="60" y="318" fill="#E5E7EB" font-size="14" font-weight="600">Off by default</text>
    <text x="60" y="340" fill="#94A3B8" font-size="12.5">Workspace switch + per-machine</text>
    <text x="60" y="356" fill="#94A3B8" font-size="12.5">opt-in, enforced by the agent</text>

    <text x="340" y="318" fill="#E5E7EB" font-size="14" font-weight="600">Two-person approval</text>
    <text x="340" y="340" fill="#94A3B8" font-size="12.5">By default a second admin</text>
    <text x="340" y="356" fill="#94A3B8" font-size="12.5">approves each remote action</text>

    <text x="620" y="318" fill="#E5E7EB" font-size="14" font-weight="600">Signed envelopes</text>
    <text x="620" y="340" fill="#94A3B8" font-size="12.5">RSA SHA-256, key pinned at enrollment</text>
    <text x="620" y="356" fill="#94A3B8" font-size="12.5">Rejects unsigned, expired, replayed</text>

    <text x="900" y="318" fill="#E5E7EB" font-size="14" font-weight="600">No admin API keys</text>
    <text x="900" y="340" fill="#94A3B8" font-size="12.5">Auditor or analyst roles only;</text>
    <text x="900" y="356" fill="#94A3B8" font-size="12.5">secrets stored as SHA-256 hashes</text>
  </g>
</svg>
